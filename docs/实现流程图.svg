<text x="92.0" y="336.0" font-size="15" fill="#0F172A">· 环境落位：Windows venv / CPU-only / 32GB；模型三件套（BERT 微调 acc 99.0%、GPT-2）</text>
<text x="92.0" y="358.0" font-size="15" fill="#0F172A">· perf_runner 明文基线（threads=8 锁定）：GPT-2 P50 792.4ms / BERT P50 38.4ms</text>
<text x="92.0" y="380.0" font-size="15" fill="#0F172A">· 口径声明：同机单轮绝对时延不作跨阶段锚点，以多轮区间呈现</text>
