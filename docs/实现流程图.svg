<text x="92.0" y="670.0" font-size="15" fill="#0F172A">· SM2DH 密钥协商（GB/T 32918.3）；SM4-GCM 自实现 + RFC 8998 附录 A.1 外部标准向量锚定</text>
<text x="92.0" y="692.0" font-size="15" fill="#0F172A">· 定点化实测：激活 Q16 + 权重 Q22，一致率 100%</text>
