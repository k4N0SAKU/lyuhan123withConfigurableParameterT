<text x="92.0" y="1138.0" font-size="15" fill="#0F172A">· 5 类攻击自动化（窃听 / MITM / 篡改 / 重放 / 合谋）：38 项零告警；判定 28 防御 + 2 边界 + 0 失败</text>
