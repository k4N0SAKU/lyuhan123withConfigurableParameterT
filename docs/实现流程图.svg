<text x="92.0" y="514.0" font-size="15" fill="#0F172A">· 定点化方案：激活 Q16；GPT-2 权重 Q22 / BERT 权重 INT8</text>
<text x="92.0" y="536.0" font-size="15" fill="#0F172A">· 解密白名单收口 P0：单钥掩码解密 + 最终输出；P1 / P2 不持任何 CKKS 私钥材料</text>
